global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-api:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
