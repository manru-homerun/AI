name: Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || '/opt/travel-ai' }}
      HEALTHCHECK_URL: https://${{ secrets.EC2_HOST }}/ready
      SHARED_GRU_ARTIFACT_DIR: /app/artifacts/shared_next_poi_gru_experiment/shared-next-poi-gru-v1
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      QA_TRACE_LOG: true
      SERVICE_NAME: travel-ai
      CENTRAL_TOURISM_BASE_YM: "202504"
      CENTRAL_TOURISM_API_URL: https://apis.data.go.kr/B551011/LocgoHubTarService1/areaBasedList1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production dependency boundary
        run: |
          ! grep -E '^torch==' requirements-production.txt

      - name: Create source bundle
        run: |
          SOURCE_BUNDLE="${RUNNER_TEMP}/travel-ai-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='notebooks' \
            --exclude='artifacts/tiny_gru_onnx_smoke' \
            --exclude='artifacts/tiny_gru_prefix_ablation' \
            --exclude='artifacts/conditional_gru_decoder_smoke' \
            -czf "${SOURCE_BUNDLE}" .
          echo "SOURCE_BUNDLE=${SOURCE_BUNDLE}" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source bundle
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '${EC2_APP_DIR}/releases/${GITHUB_SHA}' '${EC2_APP_DIR}/shared'"
          scp -i ~/.ssh/deploy_key "${SOURCE_BUNDLE}" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${EC2_APP_DIR}/releases/${GITHUB_SHA}/source.tar.gz"

      - name: Deploy with Docker Compose
        env:
          REMOTE_EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
          REMOTE_GITHUB_SHA: ${{ github.sha }}
          REMOTE_HEALTHCHECK_URL: ${{ env.HEALTHCHECK_URL }}
          REMOTE_SHARED_GRU_ARTIFACT_DIR: ${{ env.SHARED_GRU_ARTIFACT_DIR }}
          REMOTE_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          REMOTE_QA_TRACE_LOG: ${{ env.QA_TRACE_LOG }}
          REMOTE_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          REMOTE_CENTRAL_TOURISM_BASE_YM: ${{ env.CENTRAL_TOURISM_BASE_YM }}
          REMOTE_CENTRAL_TOURISM_API_URL: ${{ env.CENTRAL_TOURISM_API_URL }}
          REMOTE_DATA_OPENAPI_KEY: ${{ secrets.DATA_OPENAPI_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "EC2_APP_DIR='${REMOTE_EC2_APP_DIR}' GITHUB_SHA='${REMOTE_GITHUB_SHA}' HEALTHCHECK_URL='${REMOTE_HEALTHCHECK_URL}' SHARED_GRU_ARTIFACT_DIR='${REMOTE_SHARED_GRU_ARTIFACT_DIR}' LOG_LEVEL='${REMOTE_LOG_LEVEL}' QA_TRACE_LOG='${REMOTE_QA_TRACE_LOG}' SERVICE_NAME='${REMOTE_SERVICE_NAME}' CENTRAL_TOURISM_BASE_YM='${REMOTE_CENTRAL_TOURISM_BASE_YM}' CENTRAL_TOURISM_API_URL='${REMOTE_CENTRAL_TOURISM_API_URL}' DATA_OPENAPI_KEY='${REMOTE_DATA_OPENAPI_KEY}' bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="${EC2_APP_DIR}"
          RELEASE_DIR="${APP_DIR}/releases/${GITHUB_SHA}"
          COMPOSE_PROJECT_NAME="travel-ai"
          PREVIOUS_TARGET=""
          FAILED_STAGE="initialization"

          dc() {
            echo "+ docker compose -p ${COMPOSE_PROJECT_NAME} $*"
            docker compose -p "${COMPOSE_PROJECT_NAME}" "$@"
          }

          show_diagnostics() {
            echo "::group::deployment diagnostics"
            echo "failed stage: ${FAILED_STAGE}"
            dc ps || true
            dc logs --tail=100 ai-api nginx || true
            docker container inspect travel-ai-api || true
            docker container inspect travel-ai-nginx || true
            if [ "$(docker container inspect --format='{{.State.Status}}' travel-ai-nginx 2>/dev/null || true)" = "running" ]; then
              docker exec travel-ai-nginx nginx -T || true
            fi
            echo "::endgroup::"
          }

          check_legacy_project() {
            FAILED_STAGE="legacy project check"
            for container in travel-ai-api travel-ai-nginx; do
              if ! docker container inspect "${container}" >/dev/null 2>&1; then
                continue
              fi
              PROJECT_LABEL="$(docker container inspect --format='{{ index .Config.Labels "com.docker.compose.project" }}' "${container}" 2>/dev/null || true)"
              if [ "${PROJECT_LABEL}" = "current" ]; then
                echo "Found ${container} from legacy Docker Compose project 'current'."
                echo "Manual cleanup is required before deploying with project '${COMPOSE_PROJECT_NAME}'."
                return 1
              fi
              if [ "${PROJECT_LABEL}" != "${COMPOSE_PROJECT_NAME}" ]; then
                echo "Found ${container} with unexpected Docker Compose project '${PROJECT_LABEL:-none}'."
                echo "Manual cleanup is required before deploying with project '${COMPOSE_PROJECT_NAME}'."
                return 1
              fi
            done
          }

          wait_for_ai_health() {
            FAILED_STAGE="ai-api healthcheck"
            for attempt in $(seq 1 40); do
              HEALTH_STATUS="$(docker container inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' travel-ai-api 2>/dev/null || echo missing)"
              echo "travel-ai-api health: ${HEALTH_STATUS} (${attempt}/40)"
              if [ "${HEALTH_STATUS}" = "healthy" ]; then
                return 0
              fi
              if [ "${HEALTH_STATUS}" = "unhealthy" ]; then
                return 1
              fi
              sleep 3
            done
            return 1
          }

          wait_for_nginx_running() {
            FAILED_STAGE="nginx startup"
            STABLE_CHECKS=0
            for attempt in $(seq 1 40); do
              NGINX_STATUS="$(docker container inspect --format='{{.State.Status}}' travel-ai-nginx 2>/dev/null || echo missing)"
              NGINX_RESTARTING="$(docker container inspect --format='{{.State.Restarting}}' travel-ai-nginx 2>/dev/null || echo false)"
              NGINX_EXIT_CODE="$(docker container inspect --format='{{.State.ExitCode}}' travel-ai-nginx 2>/dev/null || echo unknown)"
              echo "travel-ai-nginx status: ${NGINX_STATUS}, restarting: ${NGINX_RESTARTING}, exit_code: ${NGINX_EXIT_CODE} (${attempt}/40)"
              if [ "${NGINX_STATUS}" = "running" ] && [ "${NGINX_RESTARTING}" = "false" ]; then
                STABLE_CHECKS=$((STABLE_CHECKS + 1))
                if [ "${STABLE_CHECKS}" -ge 3 ]; then
                  return 0
                fi
              else
                STABLE_CHECKS=0
              fi
              sleep 2
            done
            return 1
          }

          recreate_nginx() {
            FAILED_STAGE="nginx recreate"
            dc up -d --no-deps --force-recreate nginx || return 1

            wait_for_nginx_running || return 1

            FAILED_STAGE="nginx configuration"
            echo "+ docker exec travel-ai-nginx nginx -t"
            docker exec travel-ai-nginx nginx -t || return 1
          }

          check_external_health() {
            FAILED_STAGE="external HTTPS healthcheck"
            for attempt in $(seq 1 15); do
              HTTP_STATUS="$(curl -sS -o /tmp/travel-ai-healthcheck.out -w "%{http_code}" --max-time 5 "${HEALTHCHECK_URL}" || true)"
              if [ "${HTTP_STATUS}" = "200" ]; then
                echo "external healthcheck succeeded"
                return 0
              fi
              echo "external healthcheck failed (${attempt}/15): status=${HTTP_STATUS:-curl_error}"
              sleep 2
            done
            return 1
          }

          rollback() {
            if [ -z "${PREVIOUS_TARGET}" ] || [ ! -d "${PREVIOUS_TARGET}" ]; then
              echo "No previous release is available for rollback."
              return 1
            fi

            echo "Rolling back to ${PREVIOUS_TARGET}"
            ln -sfn "${PREVIOUS_TARGET}" "${APP_DIR}/current"
            cd "${APP_DIR}/current"

            FAILED_STAGE="rollback ai-api image build"
            dc build ai-api || return 1

            FAILED_STAGE="rollback ai-api startup"
            dc up -d --no-deps ai-api || return 1

            wait_for_ai_health || return 1
            recreate_nginx || return 1
            echo "rollback completed"
          }

          deploy_release() {
            FAILED_STAGE="ai-api image build"
            dc build ai-api || return 1

            FAILED_STAGE="ai-api startup"
            dc up -d --no-deps ai-api || return 1

            wait_for_ai_health || return 1
            recreate_nginx || return 1
            check_external_health || return 1
          }

          if [ -L "${APP_DIR}/current" ]; then
            PREVIOUS_TARGET="$(readlink -f "${APP_DIR}/current")"
          fi

          FAILED_STAGE="release extraction"
          tar -xzf "${RELEASE_DIR}/source.tar.gz" -C "${RELEASE_DIR}"
          rm "${RELEASE_DIR}/source.tar.gz"
          printf '%s\n' "${GITHUB_SHA}" > "${RELEASE_DIR}/REVISION"

          FAILED_STAGE="current symlink update"
          ln -sfn "${RELEASE_DIR}" "${APP_DIR}/current"
          cd "${APP_DIR}/current"

          if ! check_legacy_project; then
            show_diagnostics
            if [ -n "${PREVIOUS_TARGET}" ] && [ -d "${PREVIOUS_TARGET}" ]; then
              ln -sfn "${PREVIOUS_TARGET}" "${APP_DIR}/current"
            fi
            exit 1
          fi

          if ! deploy_release; then
            show_diagnostics
            if ! rollback; then
              echo "rollback failed"
              show_diagnostics
            fi
            exit 1
          fi

          dc ps
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
