services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: travel-ai-api:latest
    container_name: travel-ai-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TINY_GRU_ARTIFACT_DIR: /app/artifacts/tiny_gru_onnx_experiment
      COURSE_DECODER_ARTIFACT_DIR: /app/artifacts/conditional_gru_decoder_experiment
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: travel-ai-nginx
    restart: unless-stopped
    depends_on:
      - ai-api
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  travel-ai:
    driver: bridge
