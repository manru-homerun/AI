name: travel-ai

services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: travel-ai-api:latest
    container_name: travel-ai-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SHARED_GRU_ARTIFACT_DIR: ${SHARED_GRU_ARTIFACT_DIR:-/app/artifacts/shared_next_poi_gru_experiment/shared-next-poi-gru-v1}
      DATA_OPENAPI_KEY: ${DATA_OPENAPI_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-travel-ai}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      CENTRAL_TOURISM_BASE_YM: ${CENTRAL_TOURISM_BASE_YM:-202504}
      CENTRAL_TOURISM_API_URL: ${CENTRAL_TOURISM_API_URL:-https://apis.data.go.kr/B551011/LocgoHubTarService1/areaBasedList1}
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: travel-ai-nginx
    restart: unless-stopped
    depends_on:
      - ai-api
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: travel-ai-prometheus
    restart: unless-stopped
    depends_on:
      - ai-api
      - node-exporter
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: travel-ai-node-exporter
    restart: unless-stopped
    pid: host
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    networks:
      - travel-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  travel-ai:
    driver: bridge

volumes:
  prometheus-data:
