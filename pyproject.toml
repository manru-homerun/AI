[project]
name = "kor-travel-recommendation"
version = "0.1.0"
description = "TourAPI-based Korean travel recommendation experiments and ONNX serving."
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "numpy==1.26.4",
    "onnxruntime==1.19.2",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "catboost==1.2.8",
    "ipykernel==6.31.0",
    "jupyter==1.1.1",
    "matplotlib==3.9.4",
    "nbconvert==7.17.1",
    "onnx==1.17.0",
    "seaborn==0.13.2",
    "torch==2.5.1",
]

[tool.uv]
package = false

